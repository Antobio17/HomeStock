services:
  homestock:
    build:
      context: ../../
      dockerfile: ./deploy/docker/Dockerfile.worker
    container_name: homestock-python-container
    ports:
      - "8080:80"
      - "5678:5678"
    volumes:
      - ../../.:/app
    networks:
      - hometock-network

  homestock-mysql:
    image: mysql:8
    container_name: homestock-mysql-container
    ports:
      - "4306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_PASSWORD=secret
      - MYSQL_DATABASE=db
    networks:
      - hometock-network

  homestock-rabbitmq:
    image: rabbitmq:3-management
    container_name: homestock-rabbitmq-container
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=homestock
      - RABBITMQ_DEFAULT_PASS=homestockpass
    networks:
      - hometock-network

  homestock-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: homestock-elasticsearch-container
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - hometock-network

  homestock-kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: homestock-kibana-container
    environment:
      - ELASTICSEARCH_HOSTS=http://homestock-elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - hometock-network

networks:
  hometock-network: